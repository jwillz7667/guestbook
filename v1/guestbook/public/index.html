<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="style.css" rel="stylesheet">
  <title>Guestbook - v1</title>
</head>
<body>
<main>
  <header id="header"><p class="eyebrow">A PLACE TO SAY HELLO</p><h1>Guestbook - v1</h1><p>Leave a note for the next visitor.</p></header>
  <form id="guestbook-form">
    <label for="guestbook-entry-content">Your message</label>
    <textarea id="guestbook-entry-content" maxlength="500" required rows="3" placeholder="Hello from Justin!"></textarea>
    <button id="guestbook-submit" type="submit">Sign guestbook</button>
    <p id="status" role="status" aria-live="polite"></p>
  </form>
  <section aria-labelledby="entries-heading"><h2 id="entries-heading">Recent messages</h2><div id="guestbook-entries"></div></section>
  <footer>IBM container lab · Demo messages are temporary and stored per replica.</footer>
</main>
<script src="script.js"></script>
</body>
</html>
